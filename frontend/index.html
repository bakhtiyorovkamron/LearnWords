    <meta name="theme-color" content="#0E1512" />
    <!-- Before anything is painted: the saved theme (localStorage "theme") goes on <html data-theme>,
         so a light theme never flashes dark first. The same names/colours as src/lib/theme.ts (tested). -->
    <script id="theme-boot">
      (function () {
        var BG = { night: '#0E1512', light: '#F6F7F3', graphite: '#121314', sand: '#F4EFE6', navy: '#0D1220' };
        try {
          var t = localStorage.getItem('theme');
          if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'night';
          if (!Object.prototype.hasOwnProperty.call(BG, t)) t = 'night';
          var root = document.documentElement;
          if (t === 'night') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', BG[t]);
        } catch (e) { /* storage or matchMedia unavailable: night */ }
      })();
    </script>
