services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learnwords
      POSTGRES_PASSWORD: learnwords
      POSTGRES_DB: learnwords
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnwords"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317"]

  backend:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://learnwords:learnwords@postgres:5432/learnwords?sslmode=disable
      JWT_SECRET: dev-secret-change-me-0123456789abcdef
      CORS_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GIN_MODE: debug
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]

volumes:
  pgdata:
  frontend_node_modules:
