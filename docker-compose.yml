services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnwords
      POSTGRES_PASSWORD: learnwords
      POSTGRES_DB: learnwords
    # Only reachable from the server itself (not from the internet).
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnwords"]
      interval: 3s
      retries: 20


  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:${JAEGER_UI_PORT:-16687}:16686"]

  backend:
    build: .
    restart: unless-stopped
    # Public DNS: the host's systemd-resolved stub (127.0.0.53) is not reachable from containers.
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://learnwords:learnwords@postgres:5432/learnwords?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yodla.fun,https://www.yodla.fun,http://localhost:15173,http://129.121.97.22:15173}
      # Site is served over HTTPS → refresh cookie must be Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_TTS_API_KEY: ${GOOGLE_TTS_API_KEY:-}
      MEDIA_DIR: /data/media
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GIN_MODE: ${GIN_MODE:-release}
    ports: ["127.0.0.1:${BACKEND_PORT:-18080}:8080"]
    volumes: [media:/data/media]
    depends_on:
      postgres:
        condition: service_healthy

  # Free self-hosted TTS: Piper (de, en, fr) + MeloTTS (ko). Internal only, not exposed to the internet.
  tts:
    build: ./tts
    restart: unless-stopped
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/healthz"]
      interval: 15s
      retries: 10

  # Production web server: https://yodla.fun (auto HTTPS), static frontend + /api proxy.
  caddy:
    build: ./frontend
    restart: unless-stopped
    # Needed to reach Let's Encrypt / ZeroSSL when getting the HTTPS certificate.
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@yodla.fun}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Old dev URL http://IP:15173 → redirected to https://yodla.fun (stop caddy before using the dev profile).
      - "15173:15173"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend]

  # Dev server with hot reload (http://IP:15173). Start only when needed:
  #   docker compose --profile dev up -d frontend
  frontend:
    image: node:20-alpine
    profiles: ["dev"]
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    ports: ["${FRONTEND_PORT:-15173}:5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]

volumes:
  media:
  pgdata:
  frontend_node_modules:
  caddy_data:
  caddy_config:
